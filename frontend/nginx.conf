server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Avatar images / voice audio can be a few dozen MB.
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # API reverse proxy (Go Gin backend, internal network only).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Object storage gateway: /media/<bucket>/<key> -> minio/<bucket>/<key>.
    # This keeps the S3-compatible service unexposed to the host while still
    # letting the browser stream uploaded images and generated videos.
    location /media/ {
        proxy_pass http://minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
