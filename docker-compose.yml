name: talking-avatar-platform

services:
  # ---- Infrastructure: intentionally NOT exposed to the host ----
  mysql:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-talking_avatar}
      MARIADB_USER: ${MYSQL_USER:-talking}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-talking123}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    # Plain Redis — the knowledge base moved to service-rag (zvec FTS),
    # so RediSearch is no longer required.
    image: ${REDIS_IMAGE:-redis:8.2.2-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Exposed for the hybrid deployment: the Python AI Worker runs natively on
    # the macOS host (MPS) and must reach Redis via localhost.
    # protected-mode must be off: Docker's published port makes connections
    # arrive from the bridge gateway (not loopback), and with no password
    # protected-mode closes them immediately.
    command: ["sh", "-c", "exec redis-server --appendonly yes --protected-mode no $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage (RustFS).
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      # Single node, single disk (SNSD) mode for the dev environment: one
      # named volume, no erasure-coding disk-topology checks.
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      # RustFS reads its own RUSTFS_* env names; the project-wide credential
      # variables are the S3_* pair shared by every S3 consumer.
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_OBS_LOGGER_LEVEL: info
    # Exposed for the hybrid deployment: the host-native worker needs the
    # S3-compatible endpoint at localhost:9000. The console (9001) stays on
    # the internal network only — no host debugging ports.
    ports:
      - "${RUSTFS_HOST_PORT:-9000}:9000"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # One-shot bootstrap: create bucket + public read policy (dev only).
  # mc is a generic S3 client, so it works against the RustFS endpoint too.
  rustfs-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-talking-avatar}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://rustfs:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set download "local/$$S3_BUCKET" &&
        echo "object storage bucket ready"

  # ---- Application services (internal network only) ----
  # API split into three microservices sharing the same Go module:
  #   api-admin     management console (:8081, behind nginx /api)
  #   api-live      audience / live chat (:8082, behind Next.js proxy)
  #   api-scheduler worker callbacks  (:8083, behind nginx webhook routes)
  api-admin:
    build:
      context: ./backend
      args:
        SERVICE: api-admin
    restart: unless-stopped
    environment:
      API_ADMIN_PORT: "8081"
      GIN_MODE: release
      MYSQL_DSN: "${MYSQL_USER:-talking}:${MYSQL_PASSWORD:-talking123}@tcp(mysql:3306)/${MYSQL_DATABASE:-talking_avatar}?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: "0"
      TASK_QUEUE_KEY: ${TASK_QUEUE_KEY:-talking_avatar:tasks}
      LIVE_CONTROL_QUEUE_KEY: ${LIVE_CONTROL_QUEUE_KEY:-talking_avatar:live_control}
      AVATAR_INIT_QUEUE_KEY: ${AVATAR_INIT_QUEUE_KEY:-talking_avatar:avatar_init}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      EMBED_SERVER_URL: ${EMBED_SERVER_URL:-http://service-rag:8001}
      TTS_SERVICE_URL: ${TTS_SERVICE_URL:-http://service-tts:8002}
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-talking-avatar}
      S3_USE_SSL: "false"
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:8080/media}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8080}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  api-live:
    build:
      context: ./backend
      args:
        SERVICE: api-live
    restart: unless-stopped
    environment:
      API_USER_PORT: "8082"
      GIN_MODE: release
      MYSQL_DSN: "${MYSQL_USER:-talking}:${MYSQL_PASSWORD:-talking123}@tcp(mysql:3306)/${MYSQL_DATABASE:-talking_avatar}?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: "0"
      TASK_QUEUE_KEY: ${TASK_QUEUE_KEY:-talking_avatar:tasks}
      LIVE_CONTROL_QUEUE_KEY: ${LIVE_CONTROL_QUEUE_KEY:-talking_avatar:live_control}
      AVATAR_INIT_QUEUE_KEY: ${AVATAR_INIT_QUEUE_KEY:-talking_avatar:avatar_init}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-v4-flash}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      NGROK_API_URL: ${NGROK_API_URL:-http://ngrok:4040}
      TG_WEBHOOK_URL: ${TG_WEBHOOK_URL:-}
      TG_MINIAPP_URL: ${TG_MINIAPP_URL:-}
      EMBED_SERVER_URL: ${EMBED_SERVER_URL:-http://service-rag:8001}
      TTS_SERVICE_URL: ${TTS_SERVICE_URL:-http://service-tts:8002}
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-talking-avatar}
      S3_USE_SSL: "false"
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:8080/media}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8080}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  api-telegram:
    build:
      context: ./backend
      args:
        SERVICE: api-telegram
    restart: unless-stopped
    environment:
      API_TELEGRAM_PORT: "8084"
      GIN_MODE: release
      MYSQL_DSN: "${MYSQL_USER:-talking}:${MYSQL_PASSWORD:-talking123}@tcp(mysql:3306)/${MYSQL_DATABASE:-talking_avatar}?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: "0"
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      NGROK_API_URL: ${NGROK_API_URL:-http://ngrok:4040}
      TG_WEBHOOK_URL: ${TG_WEBHOOK_URL:-}
      TG_MINIAPP_URL: ${TG_MINIAPP_URL:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-web:
    build:
      context: ./backend
      args:
        SERVICE: api-web
    ports:
      - "8085:8085"
    restart: unless-stopped
    environment:
      API_WEB_PORT: "8085"
      GIN_MODE: release
      MYSQL_DSN: "${MYSQL_USER:-talking}:${MYSQL_PASSWORD:-talking123}@tcp(mysql:3306)/${MYSQL_DATABASE:-talking_avatar}?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: "0"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-scheduler:
    build:
      context: ./backend
      args:
        SERVICE: api-scheduler
    restart: unless-stopped
    environment:
      API_SCHEDULER_PORT: "8083"
      GIN_MODE: release
      MYSQL_DSN: "${MYSQL_USER:-talking}:${MYSQL_PASSWORD:-talking123}@tcp(mysql:3306)/${MYSQL_DATABASE:-talking_avatar}?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: "0"
      TASK_QUEUE_KEY: ${TASK_QUEUE_KEY:-talking_avatar:tasks}
      AVATAR_INIT_QUEUE_KEY: ${AVATAR_INIT_QUEUE_KEY:-talking_avatar:avatar_init}
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-talking-avatar}
      S3_USE_SSL: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  # Local RAG knowledge-base microservice: zvec FTS + Jieba Chinese, zero
  # model dependencies. The Go API ingests documents and runs retrieval tests
  # against it over the internal network; zvec data persists in a volume.
  service-rag:
    build:
      context: ./services/rag
    restart: unless-stopped
    environment:
      ZVEC_DATA_DIR: /app/zvec_data
    volumes:
      - rag-zvec-data:/app/zvec_data

  # Edge-TTS microservice: async edge-tts -> 16kHz PCM WAV -> S3 shared
  # storage. Returns S3 keys only; temp files are removed after upload.
  # Internal network only — no host ports (not debugged on the host).
  service-tts:
    build:
      context: ./services/tts
    restart: unless-stopped
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET:-talking-avatar}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
    depends_on:
      rustfs:
        condition: service_healthy

  # API documentation gateway (docs): aggregates every HTTP microservice's
  # Swagger / OpenAPI docs behind one entry, exposed by nginx at
  # /doc/<prefix>: /doc/api-admin, /doc/api-live, /doc/api-scheduler,
  # /doc/service-rag, /doc/service-tts
  docs:
    build:
      context: ./docs
    restart: unless-stopped
    depends_on:
      api-admin:
        condition: service_started
      api-live:
        condition: service_started
      api-telegram:
        condition: service_started
      api-web:
        condition: service_started
      api-scheduler:
        condition: service_started
      service-rag:
        condition: service_started
      service-tts:
        condition: service_started

  worker:
    build:
      context: ./worker
    restart: unless-stopped
    ipc: host
    security_opt:
      - "seccomp:unconfined"
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    group_add:
      - video
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: "0"
      TASK_QUEUE_KEY: ${TASK_QUEUE_KEY:-talking_avatar:tasks}
      LIVE_CONTROL_QUEUE_KEY: ${LIVE_CONTROL_QUEUE_KEY:-talking_avatar:live_control}
      AVATAR_INIT_QUEUE_KEY: ${AVATAR_INIT_QUEUE_KEY:-talking_avatar:avatar_init}
      API_BASE_URL: http://api-scheduler:8083
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-talking-avatar}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:8080/media}
      AI_MODE: real
      LIVEPORTRAIT_HALF: "false"
      LIVEPORTRAIT_DRIVING_SPEED: "0.2"
      LIVEPORTRAIT_DRIVING_MULTIPLIER: "0.7"
      WAV2LIP_PROVIDER: rocm
      FACE_ENHANCER: "gfpgan"
      ENHANCER_MAX_FPS: "6"
      TTS_ENGINE: edge
    volumes:
      - ./worker/models:/app/models
      - ./worker/external:/app/external
      - ./worker/fonts:/app/fonts
      - ${HOME}/.cache/torch:/root/.cache/torch
      - ${HOME}/.cache/onnxruntime:/root/.cache/onnxruntime
      - ${HOME}/.cache/miopen:/root/.cache/miopen
    depends_on:
      api-scheduler:
        condition: service_started
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  # Real-time streaming gateway (SRS v5). The host-native AI worker pushes
  # RTMP to 1935; HTTP-FLV/API stay on the internal network and are exposed
  # to the browser through the nginx /live proxy. Only 1935 is published —
  # the host worker's RTMP ingest; 1985/8081 are internal (no host debugging).
  srs:
    image: ossrs/srs:5
    restart: unless-stopped
    ports:
      - "1935:1935"   # RTMP ingest (host worker -> rtmp://localhost:1935/live/<id>)
    volumes:
      - srs-data:/usr/local/srs/objs

  # ---- Public entry point (the only host-published service) ----
  frontend-admin:
    build:
      context: ./frontend/admin
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - api-admin

  # ---- 观众端（独立 Next.js 客户端，不属于管理后台） ----
  frontend-live:
    build:
      context: ./frontend/live
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    environment:
      # Server-side proxy target: browser only talks to :3000, no CORS needed.
      # Override Docker's injected HOSTNAME (container id) which Next.js
      # standalone otherwise tries to resolve as its listen address.
      HOSTNAME: "0.0.0.0"
      API_ORIGIN: http://api-live:8082
      LIVE_ORIGIN: http://srs:8080
    depends_on:
      - api-live

  # ---- 1v1 网站（BFF，Next.js + PayPal，容器内 3000） ----
  frontend-web:
    build:
      context: ./frontend/web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3001}:3000"

  # ---- Telegram Mini App（React + Vite + TG SDK，Nginx 80） ----
  frontend-tg:
    build:
      context: ./frontend/telegram
      args:
        VITE_API_ORIGIN: ${VITE_API_ORIGIN:-}
    restart: unless-stopped
    ports:
      - "${TG_PORT:-3002}:80"

  # Ngrok tunnels: expose the TG Mini App (:3002) and the API gateway (:8080)
  # with public HTTPS URLs so Telegram WebApp can reach local services.
  ngrok:
    image: ngrok/ngrok:latest
    command: start --all --config /etc/ngrok.yml
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml
    ports:
      - "4040:4040"   # ngrok web inspector
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  srs-data:
  mysql-data:
  redis-data:
  rustfs-data:
  rag-zvec-data:
