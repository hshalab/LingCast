server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Landing page at / ; everything else is an API-docs prefix proxy.
    location = / {
        try_files /index.html =404;
    }

    # Go microservices (gin-swagger uses relative asset paths, so a plain
    # prefix-stripping proxy just works).
    location /api-admin/ {
        proxy_pass http://api-admin:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /api-live/ {
        proxy_pass http://api-live:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /api-telegram/ {
        proxy_pass http://api-telegram:8084/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /api-web/ {
        proxy_pass http://api-web:8085/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /api-scheduler/ {
        proxy_pass http://api-scheduler:8083/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # FastAPI microservices: their /docs HTML loads /openapi.json at the
    # server root. Rewrite it to the externally-visible /doc/ path (the
    # gateway is mounted behind the admin nginx at /doc/).
    location /service-rag/ {
        proxy_pass http://service-rag:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        sub_filter "'/openapi.json'" "'/doc/service-rag/openapi.json'";
        sub_filter '"/openapi.json"' '"/doc/service-rag/openapi.json"';
        sub_filter_once off;
        sub_filter_types text/html;
    }
    location /service-tts/ {
        proxy_pass http://service-tts:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        sub_filter "'/openapi.json'" "'/doc/service-tts/openapi.json'";
        sub_filter '"/openapi.json"' '"/doc/service-tts/openapi.json"';
        sub_filter_once off;
        sub_filter_types text/html;
    }
}
