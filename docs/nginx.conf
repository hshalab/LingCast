server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Landing page at / ; everything else is an API-docs prefix proxy.
    location = / {
        try_files /index.html =404;
    }

    # Go microservices (gin-swagger uses relative asset paths, so a plain
    # prefix-stripping proxy just works).
    location /api-admin/ {
        proxy_pass http://api-admin:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /api-user/ {
        proxy_pass http://api-user:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /api-scheduler/ {
        proxy_pass http://api-scheduler:8083/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # FastAPI microservices: their /docs HTML loads /openapi.json at the
    # server root, so rewrite it to the prefixed path (sub_filter).
    location /rag-service/ {
        proxy_pass http://rag-service:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        sub_filter "'/openapi.json'" "'/rag-service/openapi.json'";
        sub_filter '"/openapi.json"' '"/rag-service/openapi.json"';
        sub_filter_once off;
        sub_filter_types text/html;
    }
    location /tts-service/ {
        proxy_pass http://tts-service:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        sub_filter "'/openapi.json'" "'/tts-service/openapi.json'";
        sub_filter '"/openapi.json"' '"/tts-service/openapi.json"';
        sub_filter_once off;
        sub_filter_types text/html;
    }
}
