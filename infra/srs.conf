# main config for srs (mirrors the stock srs.conf, with a larger publish
# timeout so momentary pipe stalls — e.g. first subtitle render or producer
# contention — don't kick the live publisher).
listen              1935;
max_connections     1000;
daemon              on;
http_api {
    enabled         on;
    listen          1985;
}
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}
rtc_server {
    enabled on;
    listen 8000; # UDP port
    candidate $CANDIDATE;
}
vhost __defaultVhost__ {
    hls {
        enabled         on;
    }
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    rtc {
        enabled     on;
        rtmp_to_rtc off;
        rtc_to_rtmp off;
    }
    play {
        gop_cache_max_frames 2500;
    }
    # Default normal_timeout is 5000ms: a ~5s stall (cold font load, heavy
    # producer tick) kills the publish. 30s tolerates transient stalls; the
    # stream resumes automatically once frames flow again.
    publish {
        firstpkt_timeout 20000;
        normal_timeout   30000;
    }
}
