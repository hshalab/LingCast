<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 预览背景（实际使用时删除） -->
  <rect width="512" height="512" rx="48" fill="#000000"/>

  <!-- ═══ L 形主体 ═══ -->
  <path d="M 152 115 
           L 152 362 
           Q 152 408 198 408 
           L 268 408"
        stroke="#FFFFFF" 
        stroke-width="52" 
        stroke-linecap="round" 
        fill="none"/>

  <!-- ═══ 播放键三角形 ═══ -->
  <path d="M 305 328 L 305 488 L 438 408 Z" 
        fill="#FFFFFF"/>

  <!-- ═══ 灵动光粒子：白 → 冷蓝渐隐 ═══ -->
  <circle cx="182" cy="72"  r="14"  fill="#FFFFFF" opacity="0.95" filter="url(#glow)"/>
  <circle cx="232" cy="48"  r="9.5" fill="#C8E6FF" opacity="0.75" filter="url(#glowSoft)"/>
  <circle cx="276" cy="30"  r="6"   fill="#8ED8FF" opacity="0.55" filter="url(#glowSoft)"/>
  <circle cx="312" cy="18"  r="3.5" fill="#B8E6FF" opacity="0.35"/>
  <circle cx="340" cy="12"  r="2"   fill="#FFFFFF" opacity="0.18"/>
</svg>
