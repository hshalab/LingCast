[project]
name = "rag-service"
version = "0.1.0"
description = "Local RAG knowledge-base microservice: zvec in-process full-text search (Jieba Chinese) + FastAPI + uv, zero model dependencies"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "zvec>=0.6.0",
]

[tool.uv]
package = false
