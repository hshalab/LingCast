basePath: /api
definitions:
  handlers.avatarResponse:
    properties:
      category:
        type: string
      createdAt:
        type: string
      defaultVideoS3Url:
        type: string
      id:
        type: integer
      imageS3Key:
        type: string
      imageS3Url:
        type: string
      initQueuePos:
        type: integer
      liveSettings:
        $ref: '#/definitions/models.LiveSettings'
      name:
        type: string
      persona:
        $ref: '#/definitions/models.PersonaProfile'
      status:
        type: string
      voiceId:
        type: string
    type: object
  handlers.sceneItem:
    properties:
      avatarId:
        type: integer
      coverS3Key:
        type: string
      coverS3Url:
        type: string
      description:
        type: string
      id:
        type: integer
      isDefault:
        type: boolean
      title:
        type: string
      videos:
        items:
          $ref: '#/definitions/handlers.sceneVideoItem'
        type: array
    type: object
  handlers.sceneVideoItem:
    properties:
      description:
        type: string
      id:
        type: integer
      isDefault:
        type: boolean
      s3Key:
        type: string
      s3Url:
        type: string
      sceneId:
        type: integer
    type: object
  handlers.taskResponse:
    properties:
      avatarId:
        type: integer
      avatarName:
        type: string
      createdAt:
        type: string
      errorMessage:
        type: string
      id:
        type: integer
      outputVideoS3Url:
        type: string
      progress:
        type: integer
      sceneId:
        type: integer
      sceneName:
        type: string
      sceneVideoId:
        type: integer
      scriptText:
        type: string
      stage:
        type: string
      status:
        type: string
      ttsS3Key:
        type: string
      updatedAt:
        type: string
      videoName:
        type: string
    type: object
  models.LiveSettings:
    properties:
      subtitleBorder:
        description: stroke width in px (0 = none)
        type: integer
      subtitleEnabled:
        type: boolean
      subtitleFont:
        description: font filename in worker/fonts/, "" = system default
        type: string
      subtitlePosition:
        description: '"bottom" | "top"'
        type: string
      subtitleSize:
        description: px
        type: integer
    type: object
  models.PersonaProfile:
    properties:
      age:
        type: integer
      ethnicity:
        type: string
      heightCm:
        type: integer
      personality:
        type: string
      relationshipStatus:
        type: string
      weightKg:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: LingCast 数字人直播平台 API（api-admin / api-user / api-scheduler 共用一份 OpenAPI
    文档；管理端写操作与 /users、/admin/* 需登录会话，观众端与 Worker Webhook 公开）。
  title: LingCast API
  version: 1.0.0
paths:
  /admin/change-name:
    post:
      consumes:
      - application/json
      parameters:
      - description: new display name
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Change the admin display name
      tags:
      - admin
  /admin/change-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: currentPassword + newPassword
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Change the admin password (current password required)
      tags:
      - admin
  /admin/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: username + password
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Admin login (HttpOnly cookie session)
      tags:
      - admin
  /admin/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Admin logout
      tags:
      - admin
  /admin/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Current admin profile
      tags:
      - admin
  /avatars:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List all avatars
      tags:
      - avatars
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Avatar name
        in: formData
        name: name
        required: true
        type: string
      - description: Appearance image
        in: formData
        name: image
        required: true
        type: file
      - description: Edge-TTS voice id
        in: formData
        name: voice_id
        type: string
      - description: Category (闲聊/知识/娱乐/游戏/带货/其他)
        in: formData
        name: category
        type: string
      - description: Age
        in: formData
        name: age
        type: integer
      - description: Height in cm
        in: formData
        name: height_cm
        type: integer
      - description: Weight in kg
        in: formData
        name: weight_kg
        type: integer
      - description: Ethnicity
        in: formData
        name: ethnicity
        type: string
      - description: Relationship status
        in: formData
        name: relationship_status
        type: string
      - description: Personality
        in: formData
        name: personality
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.avatarResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: 'Create an avatar (multipart: name + image + optional persona fields)'
      tags:
      - avatars
  /avatars/{id}:
    delete:
      parameters:
      - description: Avatar ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Delete an avatar (cascades tasks/sessions/files)
      tags:
      - avatars
    get:
      parameters:
      - description: Avatar ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.avatarResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get a single avatar (includes liveSettings)
      tags:
      - avatars
    put:
      consumes:
      - multipart/form-data
      parameters:
      - description: Avatar ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.avatarResponse'
      summary: Edit an avatar (name/category/voice/persona profile)
      tags:
      - avatars
  /avatars/{id}/default-video:
    post:
      consumes:
      - application/json
      parameters:
      - description: Avatar ID
        in: path
        name: id
        required: true
        type: integer
      - description: videoS3Key + status
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.avatarResponse'
      summary: 'Worker webhook: persist base video + status'
      tags:
      - worker
  /avatars/{id}/knowledge-selection:
    get:
      parameters:
      - description: Avatar ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List global collections with this avatar's bind/enabled state
      tags:
      - knowledge
    post:
      consumes:
      - application/json
      parameters:
      - description: Avatar ID
        in: path
        name: id
        required: true
        type: integer
      - description: 'collectionIds: []uint'
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Set which global collections are bound/enabled for an avatar
      tags:
      - knowledge
  /avatars/{id}/live-settings:
    put:
      consumes:
      - application/json
      parameters:
      - description: Avatar ID
        in: path
        name: id
        required: true
        type: integer
      - description: live settings
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LiveSettings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.avatarResponse'
      summary: Save live settings (subtitles etc., JSON)
      tags:
      - avatars
  /avatars/{id}/retry:
    post:
      parameters:
      - description: Avatar ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Regenerate the base driving video
      tags:
      - avatars
  /avatars/{id}/scenes:
    get:
      parameters:
      - description: Avatar ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List scenes of an avatar (filtered by avatar, with videos)
      tags:
      - scenes
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Avatar ID
        in: path
        name: id
        required: true
        type: integer
      - description: Scene title
        in: formData
        name: title
        required: true
        type: string
      - description: Scene description
        in: formData
        name: description
        type: string
      - description: Cover image (defaults to avatar image)
        in: formData
        name: cover
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.sceneItem'
      summary: Create a scene for an avatar (cover defaults to the avatar image)
      tags:
      - scenes
  /avatars/{id}/skip:
    post:
      parameters:
      - description: Avatar ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Skip base-video generation for an avatar
      tags:
      - avatars
  /chat/guest:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get a temporary guest identity
      tags:
      - chat
  /chat/history:
    get:
      parameters:
      - description: Filter by avatar
        in: query
        name: avatarId
        type: integer
      - description: Filter by user
        in: query
        name: userId
        type: integer
      - description: Page (1-based)
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Persisted room chat history (paginated)
      tags:
      - chat
  /chat/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: login form
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Login (merges guest messages into the account)
      tags:
      - chat
  /chat/logs:
    get:
      parameters:
      - description: Filter by avatar
        in: query
        name: avatarId
        type: integer
      - description: Filter by user
        in: query
        name: userId
        type: integer
      - description: Filter by date (YYYY-MM-DD)
        in: query
        name: date
        type: string
      - description: Keyword in message content
        in: query
        name: q
        type: string
      - description: Page (1-based)
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Admin chat logs (avatarId/userId/date/q + pagination)
      tags:
      - admin
  /chat/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: registration form
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Register (upgrades the guest row, keeps history)
      tags:
      - chat
  /knowledge-collections:
    get:
      parameters:
      - description: Keyword in collection name
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List global knowledge collections (optional ?q keyword)
      tags:
      - knowledge
    post:
      consumes:
      - application/json
      parameters:
      - description: name
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      summary: Create a global knowledge collection
      tags:
      - knowledge
  /knowledge-collections/{id}:
    delete:
      parameters:
      - description: Collection ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Delete a collection (cascades documents + indexes)
      tags:
      - knowledge
    put:
      consumes:
      - application/json
      parameters:
      - description: Collection ID
        in: path
        name: id
        required: true
        type: integer
      - description: name
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Rename a knowledge collection
      tags:
      - knowledge
  /knowledge-collections/{id}/documents:
    get:
      parameters:
      - description: Collection ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List documents of a collection
      tags:
      - knowledge
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Collection ID
        in: path
        name: id
        required: true
        type: integer
      - description: Plain text content
        in: formData
        name: text
        type: string
      - description: .txt/.pdf source file
        in: formData
        name: file
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      summary: Add a document (text or .txt/.pdf upload)
      tags:
      - knowledge
  /knowledge-collections/{id}/documents/{did}:
    delete:
      parameters:
      - description: Collection ID
        in: path
        name: id
        required: true
        type: integer
      - description: Document ID
        in: path
        name: did
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Delete a document (including its indexes)
      tags:
      - knowledge
  /knowledge-collections/{id}/documents/{did}/chunks:
    post:
      parameters:
      - description: Collection ID
        in: path
        name: id
        required: true
        type: integer
      - description: Document ID
        in: path
        name: did
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Inspect the indexed chunks of a document
      tags:
      - knowledge
  /knowledge/search:
    post:
      consumes:
      - application/json
      parameters:
      - description: query + avatarId/collectionId
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Retrieval test (avatarId or collectionId, Top-3)
      tags:
      - knowledge
  /live:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List currently live bots
      tags:
      - live
  /live/{avatarID}/message:
    post:
      consumes:
      - application/json
      parameters:
      - description: Avatar ID
        in: path
        name: avatarID
        required: true
        type: integer
      - description: text + userId + username
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: 'Send a chat message (async: 202 + background LLM reply)'
      tags:
      - live
  /live/{avatarID}/push:
    post:
      consumes:
      - application/json
      parameters:
      - description: Avatar ID
        in: path
        name: avatarID
        required: true
        type: integer
      - description: text
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
      summary: Push a sentence into the live queue (studio test)
      tags:
      - live
  /live/{avatarID}/start:
    post:
      parameters:
      - description: Avatar ID
        in: path
        name: avatarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Start a live stream session
      tags:
      - live
  /live/{avatarID}/status:
    get:
      parameters:
      - description: Avatar ID
        in: path
        name: avatarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Live session status + queue
      tags:
      - live
  /live/{avatarID}/stop:
    post:
      parameters:
      - description: Avatar ID
        in: path
        name: avatarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Stop a live stream session
      tags:
      - live
  /live/chat:
    post:
      consumes:
      - application/json
      parameters:
      - description: chat request (sessionId + text)
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Live-chat orchestrator (LLM -> TTS -> queue)
      tags:
      - live
  /scenes/{id}:
    delete:
      parameters:
      - description: Scene ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Delete a scene (cascades videos; default scene is protected)
      tags:
      - scenes
    put:
      consumes:
      - multipart/form-data
      parameters:
      - description: Scene ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.sceneItem'
      summary: Edit scene title/description/cover
      tags:
      - scenes
  /scenes/{id}/videos:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Scene ID
        in: path
        name: id
        required: true
        type: integer
      - description: Video description (e.g. 趴着/雨伞下)
        in: formData
        name: description
        type: string
      - description: Video file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.sceneVideoItem'
      summary: Upload a driving video into a scene
      tags:
      - scenes
  /scenes/{id}/videos/{vid}:
    delete:
      parameters:
      - description: Scene ID
        in: path
        name: id
        required: true
        type: integer
      - description: Video ID
        in: path
        name: vid
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Delete a scene video
      tags:
      - scenes
  /tasks:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List broadcast tasks (newest first)
      tags:
      - tasks
    post:
      consumes:
      - application/json
      parameters:
      - description: avatarId + scriptText
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.taskResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Create a broadcast (offline video) task
      tags:
      - tasks
  /tasks/{id}:
    delete:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
