[project]
name = "tts-service"
version = "0.1.0"
description = "Production-ready Edge-TTS microservice: async edge-tts -> 16kHz PCM WAV -> S3 (RustFS) shared storage"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "edge-tts>=6.1",
    "boto3>=1.34",
]

[tool.uv]
package = false
