server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Avatar images / voice audio can be a few dozen MB.
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Worker callbacks (task status / base-video webhooks) go to the
    # scheduler microservice.
    location ~ ^/api/tasks/[0-9]+/status$ {
        proxy_pass http://api-scheduler:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location ~ ^/api/avatars/[0-9]+/base-video$ {
        proxy_pass http://api-scheduler:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # API reverse proxy -> admin microservice (management console).
    location /api/ {
        proxy_pass http://api-admin:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API documentation gateway (docs): aggregates Swagger/OpenAPI docs of
    # every HTTP microservice under /doc/<prefix> (api-admin / api-user /
    # api-scheduler / rag-service / tts-service).
    location /doc/ {
        proxy_pass http://docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Object storage gateway: /media/<bucket>/<key> -> rustfs/<bucket>/<key>.
    # This keeps the S3-compatible service unexposed to the host while still
    # letting the browser stream uploaded images and generated videos.
    location /media/ {
        proxy_pass http://rustfs:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # Live streaming gateway: /live/<stream>.flv -> srs:8080/live/<stream>.flv
    # (HTTP-FLV pull for the <video> element; RTMP ingest stays internal).
    location /live/ {
        proxy_pass http://srs:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
